[project]
name = "sail-assistant"
version = "0.6.0"
description = "SAIL AI Assistant — central service (Python/FastAPI port, Stage 5-PORT)"
requires-python = ">=3.12"
dependencies = [
    # web
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    # config
    "pydantic-settings==2.15.0",
    # store
    "sqlalchemy==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.2",
    "pgvector==0.5.0",
    # agent layer (owner GO 11-Sep-2026 after the §S.1 spike — keep the pins)
    "pydantic-ai-slim[openai,anthropic]==2.42.0",
    "openai==3.13.0",
    "httpx2==2.12.0",
    "anthropic==1.5.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
    "mypy==2.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
