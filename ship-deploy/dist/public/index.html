    <script>
      // Suppress AG Grid Enterprise license errors from triggering Vite error overlay
      // This must run BEFORE any other scripts to intercept errors early
      (function() {
        // Store original handlers
        var originalOnerror = window.onerror;
        
        // Override window.onerror to suppress AG Grid license errors
        window.onerror = function(message, source, lineno, colno, error) {
          // Suppress errors that are not Error objects (AG Grid throws non-Error objects)
          if (!error || !(error instanceof Error)) {
            return true;
          }
          // Suppress AG Grid-related errors
          if (message && (
            String(message).indexOf('AG Grid') !== -1 || 
            String(message).indexOf('License') !== -1 ||
            String(message).indexOf('license') !== -1
          )) {
            return true;
          }
          // Call original handler if it exists
          if (originalOnerror) {
            return originalOnerror.apply(window, arguments);
          }
          return false;
        };
        
        // Also intercept error events in capture phase
        window.addEventListener('error', function(event) {
          if (!event.error || !(event.error instanceof Error)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return false;
          }
          if (event.message && (
            String(event.message).indexOf('AG Grid') !== -1 ||
            String(event.message).indexOf('License') !== -1
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return false;
          }
        }, true);
        
        // Auto-close Vite error overlay for AG Grid license errors
        // The overlay appears with id "vite-error-overlay" or similar
        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              if (node.nodeName === 'VITE-ERROR-OVERLAY' || 
                  (node.id && node.id.indexOf('vite') !== -1 && node.id.indexOf('error') !== -1) ||
                  (node.className && String(node.className).indexOf('vite') !== -1)) {
                // Check if the error is related to AG Grid
                var text = node.textContent || '';
                if (text.indexOf('AG Grid') !== -1 || 
                    text.indexOf('License') !== -1 ||
                    text.indexOf('not an error object') !== -1 ||
                    text.indexOf('unknown runtime error') !== -1) {
                  node.remove();
                }
              }
            });
          });
        });
        
        // Start observing when DOM is ready
        if (document.body) {
          observer.observe(document.body, { childList: true, subtree: true });
        } else {
          document.addEventListener('DOMContentLoaded', function() {
            observer.observe(document.body, { childList: true, subtree: true });
          });
        }
      })();
    </script>
