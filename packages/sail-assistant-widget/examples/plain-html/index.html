<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plain HTML host — SAIL assistant widget</title>
  <style>
    /* Deliberately hostile host styles: they must not leak into the widget, and the widget must not change them. */
    * { letter-spacing: 1px !important; }
    body { font-family: Georgia, serif; color: #402; background: #fffbe8; margin: 0; padding: 24px; }
    button { background: #c00; color: #fff; border-radius: 0; padding: 6px 14px; font-family: Georgia, serif; }
    .mock-banner { background: #ffe08a; padding: 8px 12px; border: 1px solid #c90; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="mock-banner" role="note"><strong>DEMO — MOCK identity and MOCK assistant.</strong> No real login or assistant is involved on this page.</div>
  <h1>Plain HTML host</h1>
  <p>Signed in as <span id="who">—</span></p>
  <p>
    <button id="login-a" type="button">Sign in as user A</button>
    <button id="login-b" type="button">Sign in as user B (other tenant)</button>
    <button id="logout" type="button">Sign out</button>
    <button id="mount" type="button">Mount widget</button>
    <button id="unmount" type="button">Unmount widget</button>
  </p>
  <label>Module <select id="module"><option>crewing</option><option>audit</option><option>safety</option><option>incident</option></select></label>

  <!-- 1. the pinned bundle (same file every host uses) -->
  <script src="/widget/1.0.1/sail-assistant-widget.1.0.1.js"></script>
  <script>
    // 2. the host's session (MOCK). In a real module this is its own login.
    let session = null; // 'userId|tenant|role'
    const who = document.getElementById('who');
    const params = new URLSearchParams(location.search);
    const assistantUrl = params.get('assistant') || 'http://localhost:4802';
    let widget = null;

    function mount() {
      if (widget) return;
      widget = SailAssistant.init({
        assistantUrl,
        module: document.getElementById('module').value,
        title: 'SAIL Assistant',
        subtitle: 'Plain HTML demo',
        // 3. token provider → the host module's OWN authenticated backend (here a MOCK endpoint)
        getToken: async ({ forceRefresh, signal }) => {
          const r = await fetch('/mock-token/plain', { headers: { Authorization: 'Bearer mock-session:' + (session || '') }, signal, cache: 'no-store' });
          if (!r.ok) throw new Error('token endpoint HTTP ' + r.status);
          return (await r.json()).token;
        },
        context: session ? { userKey: session.split('|')[0], tenantKey: session.split('|')[1] } : { userKey: null },
      });
      window.__widget = widget;
    }
    function setSession(s) {
      session = s;
      who.textContent = s ? s : 'nobody';
      widget && widget.updateContext(s ? { userKey: s.split('|')[0], tenantKey: s.split('|')[1] } : { userKey: null });
    }
    document.getElementById('login-a').onclick = () => setSession('101|acme|Sail Admin');
    document.getElementById('login-b').onclick = () => setSession('202|globex|Sail Admin');
    document.getElementById('logout').onclick = () => setSession(null);
    document.getElementById('mount').onclick = mount;
    document.getElementById('unmount').onclick = () => { widget && widget.destroy(); widget = null; window.__widget = null; };
    document.getElementById('module').onchange = (e) => widget && widget.updateContext({ module: e.target.value });
    setSession('101|acme|Sail Admin');
    mount();
  </script>
</body>
</html>
