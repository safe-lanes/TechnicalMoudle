<svg width="680" height="786" viewBox="0 0 680 786" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Maritime PMS multi-tenancy plan — tenant routing, ship-shore sync, and build order</title>
<desc>How every request resolves its own tenant database via the verified SAILERP domain claim, how ship-to-shore sync routes fail-closed, and the flag-gated build phases 0 to 6.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.th{font-size:14px;font-weight:500}
.t{font-size:14px;font-weight:400}
.ts{font-size:12px;font-weight:400;fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5px;fill:none}
.reg{fill:none;stroke:#B4B2A9;stroke-dasharray:4 4}
</style>
</defs>
<rect x="0" y="0" width="680" height="786" fill="#ffffff"/>

<rect class="reg" x="30" y="40" width="620" height="300" rx="8"/>
<text class="ts" x="44" y="60">Tenant routing — every request resolves its own database</text>

<rect x="60" y="78" width="250" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="185" y="99" text-anchor="middle" fill="#3C3489">SAILERP JWT (verified)</text>
<text class="ts" x="185" y="116" text-anchor="middle" fill="#534AB7">id · domain · userType</text>
<line class="arr" x1="185" y1="126" x2="185" y2="140" marker-end="url(#arrow)"/>
<rect x="60" y="140" width="250" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="185" y="161" text-anchor="middle" fill="#085041">tenantMiddleware</text>
<text class="ts" x="185" y="178" text-anchor="middle" fill="#0F6E56">verify token, read domain</text>
<line class="arr" x1="185" y1="188" x2="185" y2="202" marker-end="url(#arrow)"/>
<rect x="60" y="202" width="250" height="54" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="185" y="223" text-anchor="middle" fill="#085041">ALS-aware accessors</text>
<text class="ts" x="185" y="241" text-anchor="middle" fill="#0F6E56">getDb · getPool · getPostgresClient</text>
<line class="arr" x1="185" y1="256" x2="185" y2="272" marker-end="url(#arrow)"/>
<rect x="60" y="272" width="250" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="185" y="293" text-anchor="middle" fill="#444441">Tenant DB</text>
<text class="ts" x="185" y="310" text-anchor="middle" fill="#5F5E5A">this company's database</text>

<line class="arr" x1="310" y1="164" x2="370" y2="164" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="370" y="140" width="250" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="495" y="161" text-anchor="middle" fill="#444441">Master registry · tenants</text>
<text class="ts" x="495" y="178" text-anchor="middle" fill="#5F5E5A">domain → tuid → database_name</text>
<rect x="370" y="272" width="250" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="495" y="293" text-anchor="middle" fill="#444441">Single-tenant fallback</text>
<text class="ts" x="495" y="310" text-anchor="middle" fill="#5F5E5A">flag off ⇒ unchanged</text>

<rect class="reg" x="30" y="360" width="620" height="252" rx="8"/>
<text class="ts" x="44" y="380">Ship to shore sync — fail-closed routing</text>

<rect x="55" y="405" width="165" height="52" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="137" y="426" text-anchor="middle" fill="#3C3489">Ship</text>
<text class="ts" x="137" y="443" text-anchor="middle" fill="#534AB7">local SAILERP + domain</text>
